services:
  - type: web
    name: nemesis
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nemesis-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: nemesis-db
    plan: free
