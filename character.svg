<svg id="character-root" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c99b78"/>
      <stop offset="100%" stop-color="#a97b5a"/>
    </linearGradient>
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="layer-base">
    <ellipse cx="100" cy="60" rx="26" ry="30" fill="url(#skinGrad)"/>
    <rect x="80" y="88" width="40" height="20" fill="url(#skinGrad)"/>
    <path d="M60 108 Q100 100 140 108 L148 220 Q100 235 52 220 Z" fill="#4a5568"/>
    <rect x="58" y="120" width="18" height="90" rx="8" fill="url(#skinGrad)"/>
    <rect x="124" y="120" width="18" height="90" rx="8" fill="url(#skinGrad)"/>
    <rect x="75" y="220" width="22" height="110" rx="8" fill="#2d3748"/>
    <rect x="103" y="220" width="22" height="110" rx="8" fill="#2d3748"/>
    <ellipse cx="86" cy="335" rx="16" ry="8" fill="#1a202c"/>
    <ellipse cx="114" cy="335" rx="16" ry="8" fill="#1a202c"/>
  </g>

  <g id="layer-armor"></g>
  <g id="layer-skins"></g>
  <g id="layer-backpack"></g>
  <g id="layer-weapon"></g>

  <g id="layer-idle">
    <animateTransform id="idleAnim" attributeName="transform" type="translate"
      values="0,0; 0,-3; 0,0" dur="2.4s" repeatCount="indefinite"/>
  </g>
</svg>
